tools:
  - name: validate_config
    description: Validate an OpenColorIO configuration with ociocheck.
    source_file: scripts/validate_config.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations: {read_only_hint: true, idempotent_hint: true}
    input_schema:
      type: object
      required: [config_path]
      properties:
        config_path: {type: string}
    output_schema: {type: object}

  - name: convert_image
    description: Convert image pixels between named OCIO color spaces with oiiotool.
    source_file: scripts/convert_image.py
    execution: async
    affinity: any
    timeout_hint_secs: 600
    enforce_thread_affinity: true
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false}
    input_schema:
      type: object
      required: [input_path, output_path, from_space, to_space]
      properties:
        input_path: {type: string}
        output_path: {type: string}
        from_space: {type: string}
        to_space: {type: string}
        config_path: {type: string}
    output_schema: {type: object}

