tools:
  - name: inspect_image
    description: Inspect image dimensions, channels, format, and metadata with iinfo.
    source_file: scripts/inspect_image.py
    execution: sync
    affinity: any
    timeout_hint_secs: 30
    enforce_thread_affinity: true
    annotations: {read_only_hint: true, idempotent_hint: true}
    input_schema:
      type: object
      required: [input_path]
      properties:
        input_path: {type: string}
        verbose: {type: boolean, default: true}
    output_schema: {type: object}

  - name: make_renderer_texture
    description: Create a tiled mipmapped texture with maketx without overwriting the source.
    source_file: scripts/make_renderer_texture.py
    execution: async
    affinity: any
    timeout_hint_secs: 600
    enforce_thread_affinity: true
    annotations: {read_only_hint: false, destructive_hint: false, idempotent_hint: false}
    input_schema:
      type: object
      required: [input_path, output_path]
      properties:
        input_path: {type: string}
        output_path: {type: string}
        input_color_space: {type: string}
        output_color_space: {type: string}
        ocio_config: {type: string}
    output_schema: {type: object}

